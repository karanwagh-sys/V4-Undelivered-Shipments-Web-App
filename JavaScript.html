<script>

/* ==========================================================
   GLOBAL APPLICATION
========================================================== */

const APP = {

    session : null,

    user : null,

    dashboard : {},

    currentPage : "login",

    loading : false,

    notifications : [],

    configuration : {},

    version : "1.0.0"

};



/* ==========================================================
   DOM READY
========================================================== */

document.addEventListener("DOMContentLoaded", initializeApplication);



/* ==========================================================
   INITIALIZE
========================================================== */

function initializeApplication(){

    initializeEvents();

    validateSession();

}



/* ==========================================================
   EVENTS
========================================================== */

function initializeEvents(){

    /* Login */

    document
        .getElementById("btnLogin")
        ?.addEventListener("click", login);

    /* Logout */

    document
        .getElementById("btnLogout")
        ?.addEventListener("click", logout);

}



/* ==========================================================
   LOADER
========================================================== */

function showLoader(){

    APP.loading = true;

    document
        .getElementById("loader")

        ?.classList.add("active");

}



function hideLoader(){

    APP.loading = false;

    document
        .getElementById("loader")

        ?.classList.remove("active");

}



/* ==========================================================
   TOAST
========================================================== */

function showToast(message,type="info"){

    const container =
        document.getElementById("toastContainer");

    if(!container) return;

    const toast =
        document.createElement("div");

    toast.className =
        "toast toast-" + type;

    toast.innerHTML = `

        <span>${message}</span>

        <button>&times;</button>

    `;

    toast
        .querySelector("button")
        .onclick = ()=>toast.remove();

    container.appendChild(toast);

    setTimeout(()=>{

        toast.remove();

    },4000);

}



/* ==========================================================
   PAGE NAVIGATION
========================================================== */

function showPage(page){

    document

        .querySelectorAll(".page-container")

        .forEach(pageElement=>{

            pageElement.classList.remove("active");

        });

    document

        .getElementById(page + "Container")

        ?.classList.add("active");

    APP.currentPage = page;

}



/* ==========================================================
   API
========================================================== */

function server(functionName,...args){

    return new Promise((resolve,reject)=>{

        google.script.run

            .withSuccessHandler(resolve)

            .withFailureHandler(reject)

            [functionName](...args);

    });

}



/* ==========================================================
   SESSION
========================================================== */

async function validateSession(){

    try{

        const response =
            await server("validateSession");

        if(response.success){

            APP.session = response.session;

            APP.user = response.user;

            afterLogin();

        }else{

            showLogin();

        }

    }catch(error){

        showLogin();

    }

}



/* ==========================================================
   LOGIN SCREEN
========================================================== */

function showLogin(){

    document

        .getElementById("loginContainer")

        ?.classList.remove("hidden");

    document

        .getElementById("mainContainer")

        ?.classList.add("hidden");

}



/* ==========================================================
   AFTER LOGIN
========================================================== */

function afterLogin(){

    document

        .getElementById("loginContainer")

        ?.classList.add("hidden");

    document

        .getElementById("mainContainer")

        ?.classList.remove("hidden");

    loadLoggedInUser();

    showPage("riderDashboard");

}



/* ==========================================================
   USER
========================================================== */

function loadLoggedInUser(){

    if(!APP.user) return;

    document.getElementById("sidebarUserName").textContent =
        APP.user.name;

    document.getElementById("sidebarUserRole").textContent =
        APP.user.role;

}



/* ==========================================================
   LOGIN
========================================================== */

async function login(){

    const username =
        document.getElementById("txtUsername").value.trim();

    const password =
        document.getElementById("txtPassword").value;

    if(!username){

        showToast(
            "Username is required",
            "warning"
        );

        return;

    }

    if(!password){

        showToast(
            "Password is required",
            "warning"
        );

        return;

    }

    try{

        showLoader();

        const response =
            await server(
                "login",
                username,
                password
            );

        hideLoader();

        if(response.success){

            APP.session = response.session;

            APP.user = response.user;

            showToast(
                "Login Successful",
                "success"
            );

            afterLogin();

        }else{

            showToast(
                response.message,
                "error"
            );

        }

    }catch(error){

        hideLoader();

        showToast(
            error.message,
            "error"
        );

    }

}



/* ==========================================================
   LOGOUT
========================================================== */

async function logout(){

    try{

        await server("logout");

    }catch(e){}

    APP.session = null;

    APP.user = null;

    showLogin();

}



/* ==========================================================
   END PART 1
========================================================== */

</script>

        const ddl = $("#ddlReason");

/* ==========================================================
   ORDER NUMBER VALIDATION
========================================================== */

function validateOrderNumber(value){

    return /^[A-Za-z0-9]+$/.test(value);

}



/* ==========================================================
   IMAGE PREVIEW
========================================================== */

function previewImage(input,previewId){

    if(!input.files.length){

        return;

    }

    const file = input.files[0];

    const reader = new FileReader();

    reader.onload=function(event){

        $(previewId).src=event.target.result;

    };

    reader.readAsDataURL(file);

}



/* ==========================================================
   IMAGE COMPRESSION
========================================================== */

function compressImage(file,maxWidth=1280,quality=.75){

    return new Promise((resolve,reject)=>{

        const reader=new FileReader();

        reader.onload=function(event){

            const image=new Image();

            image.onload=function(){

                const canvas=document.createElement("canvas");

                let width=image.width;

                let height=image.height;

                if(width>maxWidth){

                    height*=maxWidth/width;

                    width=maxWidth;

                }

                canvas.width=width;

                canvas.height=height;

                const context=canvas.getContext("2d");

                context.drawImage(

                    image,

                    0,

                    0,

                    width,

                    height

                );

                canvas.toBlob(

                    blob=>{

                        resolve(blob);

                    },

                    "image/jpeg",

                    quality

                );

            };

            image.src=event.target.result;

        };

        reader.onerror=reject;

        reader.readAsDataURL(file);

    });

}



/* ==========================================================
   UPLOAD FILE
========================================================== */

async function uploadFile(file){

    const compressed=

        await compressImage(file);

    return new Promise((resolve,reject)=>{

        const reader=new FileReader();

        reader.onload=function(event){

            google.script.run

                .withSuccessHandler(resolve)

                .withFailureHandler(reject)

                .uploadFile(

                    event.target.result,

                    file.name

                );

        };

        reader.readAsDataURL(compressed);

    });

}



/* ==========================================================
   SUBMIT REQUEST
========================================================== */

async function submitRequest(){

    const orderNumber=

        $("#txtOrderNumber")

        .value

        .trim()

        .toUpperCase();

    const reason=

        $("#ddlReason")

        .value;

    const mandatory=

        $("#mandatoryProof")

        .files[0];

    const optional=

        $("#optionalProof")

        .files[0];

    if(!orderNumber){

        showToast(

            "Order Number is required",

            "warning"

        );

        return;

    }

    if(!validateOrderNumber(orderNumber)){

        showToast(

            "Order Number should contain only letters and numbers.",

            "warning"

        );

        return;

    }

    if(!reason){

        showToast(

            "Please select a reason.",

            "warning"

        );

        return;

    }

    if(!mandatory){

        showToast(

            "Mandatory proof is required.",

            "warning"

        );

        return;

    }

    try{

        showLoader();

        const mandatoryUpload=

            await uploadFile(mandatory);

        let optionalUpload=null;

        if(optional){

            optionalUpload=

                await uploadFile(optional);

        }

        const response=

            await server(

                "createSubmission",

                {

                    orderNumber:orderNumber,

                    reason:reason,

                    mandatoryProof:

                        mandatoryUpload,

                    optionalProof:

                        optionalUpload

                }

            );

        hideLoader();

        if(response.success){

            showToast(

                "Submission Created Successfully",

                "success"

            );

            clearSubmissionForm();

            loadRiderDashboard();

        }

        else{

            showToast(

                response.message,

                "error"

            );

        }

    }

    catch(error){

        hideLoader();

        showToast(

            error.message,

            "error"

        );

    }

}



/* ==========================================================
   CLEAR FORM
========================================================== */

function clearSubmissionForm(){

    $("#txtOrderNumber").value="";

    $("#ddlReason").selectedIndex=0;

    $("#mandatoryProof").value="";

    $("#optionalProof").value="";

    $("#mandatoryPreview").src="";

    $("#optionalPreview").src="";

}



/* ==========================================================
   EVENTS
========================================================== */

$("#mandatoryProof")?.addEventListener(

    "change",

    function(){

        previewImage(

            this,

            "mandatoryPreview"

        );

    }

);

$("#optionalProof")?.addEventListener(

    "change",

    function(){

        previewImage(

            this,

            "optionalPreview"

        );

    }

);

$("#btnSubmitRequest")?.addEventListener(

    "click",

    submitRequest

);

$("#btnResetSubmission")?.addEventListener(

    "click",

    clearSubmissionForm

);



/* ==========================================================
   END PART 3
========================================================== */

</script>

/* ==========================================================

========================================================== */

async function searchRepository(){

    const type=

        $("#ddlRepositorySearchType").value;

    const value=

        $("#txtRepositorySearch")

        .value

        .trim();

    if(!value){

        showToast(

            "Enter search value.",

            "warning"

        );

        return;

    }

    try{

        showLoader();

        const response=

            await server(

                "repositorySearch",

                type,

                value

            );

        hideLoader();

        if(!response.success){

            showToast(

                response.message,

                "error"

            );

            return;

        }

        renderRepository(

            response.data

        );

    }

    catch(error){

        hideLoader();

        showToast(

            error.message,

            "error"

        );

    }

}



function renderRepository(data){

    const tbody=$("#repositoryTableBody");

    tbody.innerHTML="";

    if(!data.length){

        tbody.innerHTML=

        `<tr>

            <td colspan="10">

                No Records Found

            </td>

        </tr>`;

        return;

    }

    data.forEach(item=>{

        tbody.insertAdjacentHTML(

            "beforeend",

            `

            <tr>

                <td>${item.submissionId}</td>

                <td>${item.orderNumber}</td>

                <td>${item.riderName}</td>

                <td>${item.employeeId}</td>

                <td>${item.zone}</td>

                <td>${item.warehouse}</td>

                <td>${item.lmHub}</td>

                <td>${item.reviewedBy||"-"}</td>

                <td>${item.reviewedOn||"-"}</td>

            </tr>

            `

        );

    });

}



/* ==========================================================
   NOTIFICATIONS
========================================================== */

async function loadNotifications(){

    try{

        const response=

            await server(

                "notifications"

            );

        if(!response.success){

            return;

        }

        renderNotifications(

            response.data

        );

    }

    catch(error){

        console.error(error);

    }

}



function renderNotifications(data){

    const container=

        $("#notificationList");

    container.innerHTML="";

    if(!data.length){

        container.innerHTML=

        `<div class="notification-empty">

            No Notifications

        </div>`;

        return;

    }

    data.forEach(item=>{

        container.insertAdjacentHTML(

            "beforeend",

            `

            <div class="notification-item ${item.read ? "" : "unread"}">

                <div class="notification-title">

                    ${item.title}

                </div>

                <div class="notification-message">

                    ${item.message}

                </div>

                <div class="notification-footer">

                    <span>

                        ${item.date}

                    </span>

                    ${!item.read

                    ? `<button
                            class="secondary-btn"
                            onclick="markNotificationRead('${item.id}')">

                            Mark Read

                       </button>`

                    : ""}

                </div>

            </div>

            `

        );

    });

}



async function markNotificationRead(id){

    await server(

        "markNotificationRead",

        id

    );

    loadNotifications();

    loadNotificationCount();

}



async function markAllNotificationsRead(){

    await server(

        "markAllNotificationsRead"

    );

    loadNotifications();

    loadNotificationCount();

}

function loadSettings(){

    if(!APP.user){

    $("#settingUsername").value=

        APP.user.riderName;

    $("#settingStatus").value=

}



/* ==========================================================
   CHANGE PASSWORD
========================================================== */

async function changePassword(){

    const current=

        $("#currentPassword").value;

    const password=

        $("#newPassword").value;

    const confirm=

        $("#confirmPassword").value;

    if(password!==confirm){

        showToast(

            "Passwords do not match.",

            "warning"

        );

        return;

    }

    try{

        showLoader();

        const response=

            await server(

                "changePassword",

                current,

                password

            );

        hideLoader();

        if(!response.success){

            showToast(

                response.message,

                "error"

            );

            return;

        }

        showToast(

            "Password Changed Successfully",

            "success"

        );

        $("#currentPassword").value="";

        $("#newPassword").value="";

        $("#confirmPassword").value="";

    }

    catch(error){

        hideLoader();

        showToast(

            error.message,

            "error"

        );

    }

}

/* ==========================================================
   SEARCH FILTERS
========================================================== */

function filterTable(inputId,tableBodyId){

    const value=

        $(inputId)

        .value

        .toLowerCase()

        .trim();

    const rows=

        $(tableBodyId)

        .querySelectorAll("tr");

    rows.forEach(row=>{

        row.style.display=

            row.innerText

                .toLowerCase()

                .includes(value)

            ? ""

            : "none";

    });

}



/* ==========================================================
   FORMAT DATE
========================================================== */

function formatDate(date){

    if(!date){

        return "-";

    }

    return new Date(date)

        .toLocaleString();

}



/* ==========================================================
   FORMAT NULL
========================================================== */

function safe(value){

    return value || "-";

}



/* ==========================================================

========================================================== */

function resetForm(formId){

    const form=$(formId);

    if(form){

        form.reset();

    }

}



/* ==========================================================

========================================================== */

function confirmAction(message){

    return window.confirm(message);

}

function openImage(src){
