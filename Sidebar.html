<!-- =======================================================
     SIDEBAR
======================================================== -->

<aside id="sidebar" class="sidebar">

    <!-- ==============================================
         Logo
    =============================================== -->

    <div class="sidebar-logo">

        <img
            src="https://upload.wikimedia.org/wikipedia/commons/6/6f/Truemeds_logo.png"
            alt="TrueMeds">

        <h2>

            RTO Portal

        </h2>

    </div>


    <!-- ==============================================
         Logged In User
    =============================================== -->

    <div class="sidebar-user">

        <div class="user-avatar"
             id="userAvatar">

            U

        </div>

        <div class="user-details">

            <div id="loggedUserName">

                User Name

            </div>

            <div id="loggedUserRole">

                Rider

            </div>

        </div>

    </div>


    <!-- ==============================================
         Navigation
    =============================================== -->

    <nav class="sidebar-menu">

        <!-- Dashboard -->

        <button
            class="menu-item active"
            id="menuDashboard">

            📊 Dashboard

        </button>


        <!-- New Submission -->

        <button
            class="menu-item"
            id="menuSubmission">

            📦 New Submission

        </button>


        <!-- My Submission -->

        <button
            class="menu-item"
            id="menuMySubmissions">

            📋 My Submissions

        </button>


        <!-- Pending Requests -->

        <button
            class="menu-item managerOnly hidden"
            id="menuPending">

            ⏳ Pending Requests

        </button>


        <!-- Review Request -->

        <button
            class="menu-item managerOnly hidden"
            id="menuReview">

            ✅ Review Requests

        </button>


        <!-- Admin Dashboard -->

        <button
            class="menu-item adminOnly hidden"
            id="menuAdmin">

            👨‍💼 Admin Dashboard

        </button>


        <!-- Repository -->

        <button
            class="menu-item adminOnly hidden"
            id="menuRepository">

            📚 Repository

        </button>


        <!-- Notifications -->

        <button
            class="menu-item"
            id="menuNotification">

            🔔 Notifications

            <span
                id="notificationBadge"
                class="badge hidden">

                0

            </span>

        </button>


        <!-- Settings -->

        <button
            class="menu-item"
            id="menuSettings">

            ⚙ Settings

        </button>

    </nav>


    <!-- ==============================================
         Footer
    =============================================== -->

    <div class="sidebar-footer">

        <div
            id="appVersion">

            Version 1.0

        </div>

        <button
            id="btnLogout"
            class="logout-btn">

            Logout

        </button>

    </div>

</aside>
